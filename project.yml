name: ItamarOSAuthenticator
options:
  bundleIdPrefix: net.itamaros
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  ItamarOSAuthenticator:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: ItamarOSAuthenticator
        excludes:
          - Info.plist
    info:
      path: ItamarOSAuthenticator/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.itamaros.authenticator
        PRODUCT_NAME: ItamarOSAuthenticator
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
